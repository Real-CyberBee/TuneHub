<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TuneHub — Ambient Electronic Music</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c11'/%3E%3Cpath d='M8 20c3-8 5-8 8 0s5 8 8 0' stroke='%23ffd166' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>TuneHub</h1>
      <span class="zh">Ambient Electronic</span>
      <button id="localeBtn" class="locale" type="button" title="Switch language to Chinese">中文</button>
    </div>
    <p class="tagline" id="tagline">Make music in a few clicks</p>
    <a class="product-link" id="handpanLink" href="./handpan.html">Handpan Solo ↗</a>
  </header>

  <section class="ambient-picker" aria-labelledby="ambientTitle">
    <div class="section-heading">
      <div>
        <p class="eyebrow" id="ambientEyebrow">Ambient Electronic · Scene Radio</p>
        <h2 id="ambientTitle">Where are you listening?</h2>
      </div>
      <p id="sceneStatus" class="scene-status" aria-live="polite"></p>
    </div>
    <div class="scenes" id="scenes" aria-label="Ambient electronic music scenes"></div>
  </section>

  <section class="stage">
    <canvas id="viz" aria-label="Musical note visualization"></canvas>
    <div class="hud">
      <span id="seedLabel" title="Piece seed: the same seed always creates the same music">Seed —</span>
      <span class="sep">·</span>
      <span id="statLabel">—</span>
    </div>
  </section>

  <section class="controls">
    <div class="knobs">
      <label class="knob">
        <span class="kname" id="moodLabel">Mood</span>
        <input type="range" id="mood" min="0" max="1" step="0.01" value="0.45">
        <span class="kends"><b id="moodLow">Dark</b><b id="moodHigh">Bright</b></span>
      </label>
      <label class="knob">
        <span class="kname" id="energyLabel">Energy</span>
        <input type="range" id="energy" min="0" max="1" step="0.01" value="0.55">
        <span class="kends"><b id="energyLow">Calm</b><b id="energyHigh">Lively</b></span>
      </label>
      <label class="knob">
        <span class="kname" id="bpmLabel">Tempo</span>
        <input type="range" id="bpm" min="56" max="168" step="1" value="92">
        <span class="kends"><b id="bpmLow">Slow</b><b id="bpmHigh">Fast</b></span>
      </label>
    </div>

    <div class="actions">
      <button id="playBtn" class="primary">▶ Play</button>
      <button id="endlessBtn" class="endless" aria-pressed="false" title="Automatically compose the next segment before this one ends, without interrupting playback">∞ Endless mode</button>
      <button id="rerollBtn" title="Create another piece while keeping locked parts">🎲 Reroll</button>
      <button id="scaleBtn" title="Change scale while keeping the same seed">🎼 Change scale</button>
    </div>

    <div class="voices" id="voices" aria-label="Parts"></div>
  </section>

  <footer>
    <div class="row">
      <button id="shareBtn" class="ghost">🔗 Copy share link</button>
      <button id="exportBtn" class="ghost">⬇ Export WAV</button>
      <button id="stemsBtn" class="ghost" title="Export editable WAV files for each part">⬇ Export stems</button>
      <button id="midiBtn" class="ghost" title="Export an editable Standard MIDI File">♫ Export MIDI</button>
      <button id="scoreBtn" class="ghost" title="Export a lossless Score with content references and microtonal pitch data">▤ Export Score</button>
      <button id="offlineBtn" class="ghost" title="Render from the seed to compare offline rendering with realtime playback">♻ Render 10s offline</button>
    </div>
    <p class="hint" id="hint">
      Press Play or adjust the three sliders. Lock the parts you like before rerolling the others.
    </p>
  </footer>

</div>

<script type="module" src="./src/ui/app.mjs"></script>
</body>
</html>
