<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TuneHub">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1b2136"/>
      <stop offset="0.55" stop-color="#101322"/>
      <stop offset="1" stop-color="#08090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="1" stop-color="#f2b544"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: safe for maskable icons (glyph stays inside the 80% safe circle). -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="228" r="238" fill="url(#glow)"/>

  <!-- Hub rings: tuned resonances around the centre. -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#ffd166" stroke-opacity="0.10" stroke-width="5"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffd166" stroke-opacity="0.17" stroke-width="5"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#ffd166" stroke-opacity="0.26" stroke-width="5"/>

  <!-- Waveform: one clean period, peak-to-peak the full width of the hub. -->
  <path d="M130 256C172 115 214 115 256 256S340 397 382 256"
        fill="none" stroke="url(#wave)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centre node. -->
  <circle cx="256" cy="256" r="17" fill="#ffd166"/>
  <circle cx="256" cy="256" r="38" fill="none" stroke="#ffd166" stroke-opacity="0.45" stroke-width="6"/>
</svg>
